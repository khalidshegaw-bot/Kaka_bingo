<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kaka Bingo - Admin Control Panel</title>
  <style>
    body { font-family: sans-serif; background: #0f172a; color: #fff; padding: 20px; max-width: 600px; margin: auto; }
    h1 { color: #38bdf8; text-align: center; }
    .card { background: #1e293b; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #334155; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 5px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; }
    button { width: 100%; padding: 10px; margin-top: 15px; background: #0284c7; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; }
    button:hover { background: #0369a1; }
    .stat-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #334155; }
  </style>
</head>
<body>
  <h1>🛠️ Kaka Bingo Admin</h1>

  <div class="card">
    <h3>🔑 Authentication</h3>
    <label>Admin Password:</label>
    <input type="password" id="adminPass" value="Kaka_khalid">
    <button onclick="fetchStats()">Connect & Load Stats</button>
  </div>

  <div class="card">
    <h3>📊 Live Stats</h3>
    <div class="stat-row"><span>Active Players in Room:</span> <strong id="activePlayers">-</strong></div>
    <div class="stat-row"><span>Total Registered Users:</span> <strong id="totalUsers">-</strong></div>
    <div class="stat-row"><span>Current Derash Pool:</span> <strong id="derashPool">-</strong></div>
    <div class="stat-row"><span>Total House Commission:</span> <strong id="houseCommission">-</strong></div>
  </div>

  <div class="card">
    <h3>⚙️ Bot Control Configuration</h3>
    <label>Min Bots Per Round:</label>
    <input type="number" id="minBots">
    <label>Max Bots Per Round:</label>
    <input type="number" id="maxBots">
    <label>Min Cards Per Bot:</label>
    <input type="number" id="minCards">
    <label>Max Cards Per Bot:</label>
    <input type="number" id="maxCards">
    <button onclick="updateBots()">Save Bot Settings</button>
  </div>

  <script>
    async function fetchStats() {
      const pass = document.getElementById('adminPass').value;
      try {
        const res = await fetch('/api/admin/stats', { headers: { 'x-admin-pass': pass } });
        if (!res.ok) return alert('Unauthorized! Check your password.');
        const data = await res.json();
        document.getElementById('activePlayers').innerText = data.activePlayers;
        document.getElementById('totalUsers').innerText = data.totalRegisteredUsers;
        document.getElementById('derashPool').innerText = data.totalDerash + ' ETB';
        document.getElementById('houseCommission').innerText = data.totalHouseCommission + ' ETB';

        document.getElementById('minBots').value = data.botConfig.MIN_BOTS_PER_ROUND;
        document.getElementById('maxBots').value = data.botConfig.MAX_BOTS_PER_ROUND;
        document.getElementById('minCards').value = data.botConfig.MIN_CARDS_PER_BOT;
        document.getElementById('maxCards').value = data.botConfig.MAX_CARDS_PER_BOT;
      } catch (err) {
        alert('Error fetching admin stats.');
      }
    }

    async function updateBots() {
      const pass = document.getElementById('adminPass').value;
      const body = {
        minBots: document.getElementById('minBots').value,
        maxBots: document.getElementById('maxBots').value,
        minCards: document.getElementById('minCards').value,
        maxCards: document.getElementById('maxCards').value
      };

      try {
        const res = await fetch('/api/admin/update-bots', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'x-admin-pass': pass },
          body: JSON.stringify(body)
        });
        if (!res.ok) return alert('Failed to update.');
        alert('Bot configuration updated successfully!');
      } catch (err) {
        alert('Error updating bot settings.');
      }
    }
  </script>
</body>
</html>
