<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kaka Bingo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #0b111e;
      --card-bg: #141c2e;
      --border-color: #1e293b;
      --text-color: #ffffff;
      --accent-gold: #f59e0b;
      --accent-green: #10b981;
      --accent-red: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, sans-serif; user-select: none; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 12px; display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Header stats */
    .top-header { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
    .stat-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 4px; text-align: center; }
    .stat-label { font-size: 10px; opacity: 0.7; font-weight: 700; text-transform: uppercase; }
    .stat-val { font-size: 14px; font-weight: 800; margin-top: 2px; }
    .val-gold { color: var(--accent-gold); }
    .val-green { color: var(--accent-green); }

    /* Views */
    #selection-view, #game-view { width: 100%; display: flex; flex-direction: column; align-items: center; }
    .toggles-row { width: 100%; display: flex; justify-content: space-between; align-items: center; margin: 10px 0; }
    
    /* Buttons & Controls */
    .btn-main { width: 100%; padding: 14px; background: var(--accent-red); color: white; font-weight: 800; font-size: 16px; border: none; border-radius: 10px; margin: 10px 0; cursor: pointer; }
    .slots-container { display: flex; gap: 10px; margin: 10px 0; width: 100%; justify-content: center; }
    .slot-card { flex: 1; border: 2px dashed #334155; border-radius: 10px; padding: 15px; text-align: center; font-size: 12px; color: #64748b; }
    
    /* Active Game Master Board */
    .master-board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: var(--card-bg); border-radius: 10px; padding: 8px; width: 100%; }
    .board-cell { background: #1e293b; padding: 6px 2px; text-align: center; font-size: 11px; font-weight: bold; border-radius: 4px; }
    .board-cell.called { background: var(--accent-gold); color: #000; }
    .board-cell.called-even { background: var(--accent-green); color: #fff; }
    
    /* Ball Call Indicator */
    .current-ball { background: var(--accent-gold); color: #000; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 900; box-shadow: 0 0 12px var(--accent-gold); margin: 5px auto; }
  </style>
</head>
<body>

  <!-- Top Navigation Stats Header -->
  <div class="top-header">
    <div class="stat-card"><div class="stat-label" id="hdr-lbl-1">DERASH</div><div class="stat-val val-green" id="hdr-card-1">0.00 ETB</div></div>
    <div class="stat-card"><div class="stat-label" id="hdr-lbl-2">BALLS</div><div class="stat-val" id="hdr-card-2">0/75</div></div>
    <div class="stat-card"><div class="stat-label" id="hdr-lbl-3">PLAYERS</div><div class="stat-val val-gold" id="hdr-card-3">0</div></div>
    <div class="stat-card" id="hdr-card-4"><div class="stat-label">LAST BALL</div><div class="stat-val val-gold" id="last-ball-val">--</div></div>
  </div>

  <!-- LOBBY / CARD SELECTION VIEW (Image 2978) -->
  <div id="selection-view">
    <h3 style="margin-top: 10px;">🎲 Select Cards</h3>
    <p style="font-size: 12px; opacity: 0.7; margin-bottom: 8px;">Game starting soon...</p>
    
    <button class="btn-main" id="lock-btn">Lock Cards & Start</button>

    <div class="slots-container">
      <div class="slot-card" id="slot-1">+<br>Slot 1 Empty</div>
      <div class="slot-card" id="slot-2">+<br>Slot 2 Empty</div>
    </div>
  </div>

  <!-- ACTIVE GAME STATE VIEW (Images 2924 & 2562) -->
  <div id="game-view" style="display: none;">
    <div class="toggles-row">
      <div class="current-ball" id="active-ball">--</div>
    </div>
    
    <div class="master-board" id="master-board">
      <!-- 75 Bingo Cells standard grid -->
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    const socket = io();

    // Render Master Board Grid
    const boardEl = document.getElementById('master-board');
    for (let i = 1; i <= 75; i++) {
      const cell = document.createElement('div');
      cell.className = 'board-cell';
      cell.id = `cell-${i}`;
      cell.innerText = i;
      boardEl.appendChild(cell);
    }

    // Toggle Game States dynamically from Server
    socket.on('gameState', (data) => {
      const selectionView = document.getElementById('selection-view');
      const gameView = document.getElementById('game-view');

      if (data.status === 'ACTIVE' || data.status === 'PLAYING') {
        selectionView.style.display = 'none';
        gameView.style.display = 'flex';

        if (data.currentBall) {
          document.getElementById('active-ball').innerText = data.currentBall;
          document.getElementById('last-ball-val').innerText = data.currentBall;
        }

        if (data.calledBalls) {
          data.calledBalls.forEach(num => {
            const el = document.getElementById(`cell-${num}`);
            if (el) el.classList.add('called');
          });
        }
      } else {
        selectionView.style.display = 'flex';
        gameView.style.display = 'none';
      }
    });
  </script>
</body>
</html>
